[project]
name = "ai-news-aggregator"
version = "0.1.0"
description = "Daily AI governance news digest emailed via Gmail"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ai-news-aggregator = "ai_news_aggregator:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
